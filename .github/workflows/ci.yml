name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Run Python tests
        run: python -m unittest discover -s tests -q
      - name: Run offline evaluation smoke suite
        run: python scripts/run_evaluation.py
      - name: Audit repository health and secrets
        run: python scripts/audit_repository.py --fail-on-high
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Check browser JavaScript
        run: |
          node --check src/medical_agent/web/shared.js
          node --check src/medical_agent/web/execution-view.js
          node --check src/medical_agent/web/app.js
          node --check src/medical_agent/web/evidence.js
