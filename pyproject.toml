[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-agent-mvp"
version = "0.1.0"
description = "A dependency-aware, evidence-first medical-agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "mypy>=1.13",
    "ruff>=0.8",
]
vector = [
    "numpy>=1.26",
    "faiss-cpu>=1.8.0",
]

[project.scripts]
medical-agent = "medical_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medical_agent = ["resources/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
